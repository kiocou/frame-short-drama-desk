[package]
name = "frame-short-drama-desk"
version = "2.3.1"
description = "FRAME short drama desktop workspace"
authors = ["FRAME"]
edition = "2021"

[lib]
name = "frame_short_drama_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
